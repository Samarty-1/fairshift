name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: demo runs and its roster passes the audit
        run: |
          fairshift demo --out demo-rota
          fairshift check examples/cafe.yaml --roster demo-rota/roster.csv
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fairshift .
      - name: container serves the app
        run: |
          docker run -d -p 8000:8000 --name fs fairshift
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/demo | grep -q Kopi
